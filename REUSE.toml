version = 1
SPDX-PackageName = "OpenRhen"
SPDX-PackageSupplier = "Jondi Haynes"
SPDX-PackageDownloadLocation = "https://github.com/Jondi-Studio-Public/openrhen"

# The catch-all comes first: when several annotations match a path, the last one wins, so the narrower
# annotations below (the Inter font and the Code of Conduct) must follow it.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2024-2026 Jondi Haynes and OpenRhen contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "portal/public/fonts/InterVariable.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "portal/public/fonts/Inter-LICENSE.txt"
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant authors"
SPDX-License-Identifier = "CC-BY-4.0"
