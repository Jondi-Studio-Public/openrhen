[package]
name = "rhen-watch"
license = "Apache-2.0"
description = "Local desktop activity recorder for OpenRhen (Windows)"
publish = false
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[lib]
name = "rhen_watch"
path = "src/lib.rs"

[[bin]]
name = "rhen-watch"
path = "src/bin/rhen-watch.rs"

[[bin]]
name = "rhen-watchw"
path = "src/bin/rhen-watchw.rs"

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"
toml_edit = "0.25.19"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_Time", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_System_Registry"] }

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString", "NSDictionary", "NSValue", "NSURL", "NSDistributedNotificationCenter", "NSThread", "NSDate", "NSRunLoop", "NSObject", "NSTimer", "NSProcessInfo"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSWorkspace", "NSRunningApplication", "NSApplication", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSEvent", "NSGraphics", "libc", "objc2-core-foundation"] }
block2 = "=0.6.2"
libc = "=0.2.177"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
