name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the exact error text. Remove anything private first.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options: [Docker Compose, From source, Other]
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: Linux x86-64, macOS arm64, ...
