# Public CI. Every job runs on a GitHub-hosted runner, because this repository is public and must not
# run outside contributors' code on anyone's own machine (scripts/test/workflow-policy.test.mjs fails
# the build if a workflow names another kind of runner). Pull requests from forks run the same jobs
# with a read-only token and no secrets; there is deliberately no pull_request_target. `ci-ok` is the
# one check the main ruleset requires.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Hosted runners are UTC already; saying so keeps date-sensitive tests the same everywhere.
  TZ: UTC

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD^1 (main, in the PR's merge commit) is what the migration journal check compares with.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm comes from the packageManager field via corepack: the org only allows GitHub-owned actions.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/ci/migration-journal.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm comes from the packageManager field via corepack: the org only allows GitHub-owned actions.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm comes from the packageManager field via corepack: the org only allows GitHub-owned actions.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # What `pnpm test` runs, minus the engine benchmark: it times the engine against wall-clock
      # ceilings and gets its own job so it never shares a two-core runner with other work.
      - run: pnpm -r --if-present test

  benchmark:
    name: Engine benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm comes from the packageManager field via corepack: the org only allows GitHub-owned actions.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:performance

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway server owned by this job. The suites refuse any non-loopback host and make and
      # drop their own databases on it.
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm comes from the packageManager field via corepack: the org only allows GitHub-owned actions.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # A hosted runner has two CPUs shared with Postgres; one package at a time on two workers keeps
      # per-test latency under the suites' timeouts. The service's default max_connections (100)
      # covers that.
      - run: pnpm -r --workspace-concurrency=1 --if-present test:integration --maxWorkers=2

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm comes from the packageManager field via corepack: the org only allows GitHub-owned actions.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # The production bundle in a real browser: unit tests, typecheck and `pnpm dev` all pass on code the
  # built output breaks. Builds the portal, starts it and clicks through it
  # (scripts/smoke/production-click.mjs) against its own throwaway database. Chrome for Testing has
  # no Linux Arm64 build, so this stays on x86-64; the self-host smoke covers Arm64.
  smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm comes from the packageManager field via corepack: the org only allows GitHub-owned actions.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:portal
      - name: Install Chrome for Testing
        run: |
          # The build puppeteer-core is pinned to, so a dependency bump moves the browser with it.
          # Accepted risk: this is an HTTPS-only download with no checksum pin,
          # of a binary that only runs the smoke against a throwaway
          # database in a job with a read-only token and no secrets. The pinned tools in the hygiene
          # job, which gate the secret scan itself, are sha256-checked.
          exe=$(node scripts/smoke/install-chrome.mjs "$RUNNER_TOOL_CACHE/chrome-for-testing")
          missing=$(ldd "$exe" | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "::error::Chrome needs shared libraries this runner lacks:"
            echo "$missing"
            exit 1
          fi
          "$exe" --version
          echo "SMOKE_BROWSER_PATH=$exe" >> "$GITHUB_ENV"
      - run: pnpm smoke:production

  # The quick start end to end (scripts/selfhost/smoke.mjs): builds every image from source (nothing
  # is published yet), starts the `app,bundled-db` stack, drives it with the CLI, restarts it, backs it
  # up and checks nothing is published beyond loopback. Runs on x86-64 and Arm64 so Apple Silicon and
  # Raspberry Pi support stay proven. No secrets and no Docker context other than the runner's own.
  selfhost-smoke:
    name: Self-host smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86-64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/selfhost/smoke.mjs --timeout-minutes 25

  # Workflow lint and a full-history secret scan, inlined because the private repository's shared
  # actions are not reachable from here. Both tools are downloaded from their release page and checked
  # against a pinned sha256 before they run.
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          curl -sSfL -o "$dir/a.tgz" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $dir/a.tgz" | sha256sum -c -
          tar -xzf "$dir/a.tgz" -C "$dir" actionlint
          "$dir/actionlint" -color
      - name: gitleaks
        env:
          VERSION: 8.28.0
          # From the v8.28.0 release's published gitleaks_8.28.0_checksums.txt (linux_x64 tarball).
          SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          curl -sSfL -o "$dir/g.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $dir/g.tgz" | sha256sum -c -
          tar -xzf "$dir/g.tgz" -C "$dir" gitleaks
          # The config is written here, not committed: the export audit forbids a .gitleaks.toml and
          # inline allow comments in the tree. It allows exactly the two RFC 8291 section 5 test
          # vectors, and only in the two web-push test files (AND: both the path and the value must
          # match); every other finding fails the job.
          cat > "$dir/gitleaks.toml" <<'TOML'
          title = "OpenRhen CI"

          [extend]
          useDefault = true

          [[allowlists]]
          description = "RFC 8291 section 5 test vectors in the web-push tests"
          condition = "AND"
          paths = [
            '''integrations/outbound-proxy/src/web-push\.test\.ts''',
            '''integrations/outbound-proxy/src/server\.test\.ts''',
          ]
          regexes = [
            '''BTBZMqHH6r4Tts7J_aSIgg''',
            '''yfWPiYE-n46HLnH0KqZOF1fJJU3MYrct3AELtAQ-oRw''',
          ]
          TOML
          "$dir/gitleaks" detect --redact --no-banner --exit-code 1 --config "$dir/gitleaks.toml"

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The org only allows GitHub-owned actions, so the reuse tool is installed from PyPI at a pinned version.
      - run: pipx run reuse==6.2.0 lint

  # An example add-on, copied over a clean checkout, must work with core without editing a core file:
  # scripts/addon/conformance.mjs checks ownership, structure, the compose merge, env fragments and routes.
  # Node and the runner's Docker (compose config only; nothing is built or started) are all it needs.
  addon-conformance:
    name: Add-on conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/addon/conformance.mjs

  # The device agent in tools/rhen-watch (Rust). Its rules are pure and tested on any OS; the Windows and macOS
  # layers are compiled and linted on windows-latest and macos-latest, the only places that prove they build. No Rust toolchain
  # action: the hosted images carry stable Rust, and the org only allows GitHub-owned actions.
  rhen-watch:
    name: rhen-watch (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: windows-latest
          - runner: macos-latest
    defaults:
      run:
        working-directory: tools/rhen-watch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      # The real Windows binaries on a real runner (a throwaway VM): install, run, stop and remove them, and
      # check the files and the start-at-logon entry appear and disappear. Observation only.
      - name: Install and uninstall smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:LOCALAPPDATA 'Programs\rhen-watch'
          .\target\release\rhen-watch.exe install
          if (-not (Test-Path "$dest\rhen-watchw.exe")) { throw 'program not installed' }
          if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'rhen-watch' -ErrorAction SilentlyContinue)) { throw 'no start-at-logon entry' }
          Start-Sleep -Seconds 5
          $status = (& "$dest\rhen-watch.exe" status) -join "`n"
          Write-Host $status
          if ($status -notmatch 'agent: running') { throw 'the installed agent is not running' }
          & "$dest\rhen-watch.exe" report
          & "$dest\rhen-watch.exe" stop
          Start-Sleep -Seconds 3
          if ((& "$dest\rhen-watch.exe" status) -match 'agent: running') { throw 'the agent did not stop' }
          & "$dest\rhen-watch.exe" uninstall --purge
          if (Test-Path "$dest\rhen-watchw.exe") { throw 'program still installed' }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'rhen-watch' -ErrorAction SilentlyContinue) { throw 'start-at-logon entry still set' }
      # The real macOS binary on a hosted runner (a throwaway VM with a logged-in session): record, stop, and check
      # what was written, not just exit codes. Observation only: it never types, clicks or focuses anything.
      - name: Record and stop smoke
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export RHEN_WATCH_DIR="$RUNNER_TEMP/rw-data"
          bin=./target/release/rhen-watch
          "$bin" run --for 60 > "$RUNNER_TEMP/run.out" 2>&1 &
          agent=$!
          running() { local out; out=$("$bin" status) && [[ "$out" == *'agent: running'* ]]; }
          for _ in $(seq 1 30); do running && break; sleep 1; done
          "$bin" status | tee "$RUNNER_TEMP/status.txt"
          grep -q 'agent: running' "$RUNNER_TEMP/status.txt"
          [ "$(stat -f '%Lp' "$RHEN_WATCH_DIR")" = 700 ] || { echo "::error::data folder is not private"; exit 1; }
          if "$bin" run --for 5 > "$RUNNER_TEMP/second.out" 2>&1; then echo "::error::a second agent started"; exit 1; fi
          grep -q 'already running' "$RUNNER_TEMP/second.out"
          sleep 8
          "$bin" stop
          for _ in $(seq 1 10); do kill -0 "$agent" 2>/dev/null || break; sleep 1; done
          if kill -0 "$agent" 2>/dev/null; then echo "::error::the agent did not stop"; exit 1; fi
          wait "$agent"
          cat "$RUNNER_TEMP/run.out"
          "$bin" report | tee "$RUNNER_TEMP/report.txt"
          sqlite3 "$RHEN_WATCH_DIR/activity.db" "select source, kind, count(*) from events group by 1, 2" | tee "$RUNNER_TEMP/rows.txt"
          grep -q '^agent|start|' "$RUNNER_TEMP/rows.txt"
          grep -q '^agent|stop|' "$RUNNER_TEMP/rows.txt"
          grep -q '^power|' "$RUNNER_TEMP/rows.txt" || echo "::warning::no power row (no power source on this runner)"
          grep -q '^foreground|' "$RUNNER_TEMP/rows.txt" || { echo "::error::no foreground row"; exit 1; }
          # A kill without a clean stop is recorded as an unknown gap at the next start.
          "$bin" run --for 120 > /dev/null 2>&1 &
          agent=$!
          for _ in $(seq 1 30); do running && break; sleep 1; done
          running || { echo "::error::the second run did not start"; exit 1; }
          sleep 3
          kill -9 "$agent"; wait "$agent" || true
          # A gap under 10 s is a restart, not an outage; wait past it.
          sleep 12
          "$bin" run --for 5 > "$RUNNER_TEMP/after-kill.out" 2>&1
          cat "$RUNNER_TEMP/after-kill.out"
          grep -q 'without a clean stop' "$RHEN_WATCH_DIR/rhen-watch.log"
          "$bin" wipe --yes
      - name: Install smoke
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export RHEN_WATCH_DIR="$RUNNER_TEMP/rw-install"
          label=org.openrhen.rhen-watch
          svc="gui/$(id -u)/$label"
          app="$HOME/Applications/rhen-watch.app"
          plist="$HOME/Library/LaunchAgents/$label.plist"
          ./target/release/rhen-watch install
          bin="$app/Contents/MacOS/rhen-watch"
          codesign --verify "$app"
          plutil -lint "$plist"
          launchctl print "$svc" > /dev/null
          running() { local out; out=$("$bin" status) && [[ "$out" == *'agent: running'* ]]; }
          pid() { tr -dc '0-9' < "$RHEN_WATCH_DIR/run.lock"; }
          running || { echo "::error::not running after install"; exit 1; }
          # Installing again replaces the app in place and starts it again.
          "$bin" install
          running || { echo "::error::not running after a second install"; exit 1; }
          # A clean stop exits 0, so launchd must not start it again (it would within its 30 s throttle).
          "$bin" stop
          sleep 35
          if running; then echo "::error::launchd restarted the agent after a clean stop"; exit 1; fi
          # A crash is restarted.
          launchctl kickstart "$svc"
          for _ in $(seq 1 20); do running && break; sleep 1; done
          running || { echo "::error::kickstart did not start it"; exit 1; }
          first=$(pid)
          kill -9 "$first"
          for _ in $(seq 1 60); do running && [ "$(pid)" != "$first" ] && break; sleep 1; done
          running && [ "$(pid)" != "$first" ] || { echo "::error::launchd did not restart the agent after a crash"; exit 1; }
          "$bin" uninstall --purge
          if launchctl print "$svc" > /dev/null 2>&1; then echo "::error::still loaded after uninstall"; exit 1; fi
          [ ! -e "$plist" ] && [ ! -e "$app" ] || { echo "::error::uninstall left files behind"; exit 1; }
          [ ! -e "$RHEN_WATCH_DIR/activity.db" ] || { echo "::error::--purge kept the data"; exit 1; }
      # Observation only: the macOS layer must never take focus, show an alert, or make input.
      - name: No focus or input calls
        shell: bash
        run: |
          if grep -nE 'activateIgnoringOtherApps|activateWithOptions|\.activate\(|NSAlert|CGEventPost|CGEventCreate(Keyboard|Mouse)Event|CGWarpMouse' src/platform/macos*.rs; then
            echo "::error::the macOS layer must not take focus, show an alert or make input"
            exit 1
          fi
      # The agent records locally and must stay that way: no network crate in its dependency tree.
      - name: No network code
        shell: bash
        run: |
          if cargo tree --locked --prefix none | grep -Ei '^(reqwest|hyper|ureq|curl|isahc|surf|attohttpc|native-tls|rustls|openssl|tokio|socket2|mio|tonic) '; then
            echo "::error::rhen-watch must not depend on a network crate"
            exit 1
          fi

  ci-ok:
    name: ci-ok
    needs: [rhen-watch, check, typecheck, unit, benchmark, integration, build, smoke, selfhost-smoke, hygiene, reuse, addon-conformance]
    # Runs even when a job above failed or was cancelled, so the required check is red, never missing.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {job: info.get("result") for job, info in needs.items() if info.get("result") != "success"}
          for job, info in sorted(needs.items()):
              print(f"{job}: {info.get('result')}")
          if not needs or bad:
              print("ci-ok failed: " + (", ".join(f"{j}={r}" for j, r in sorted(bad.items())) or "no jobs"))
              sys.exit(1)
          PY
