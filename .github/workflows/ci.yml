# Public CI. Every job runs on a GitHub-hosted runner, because this repository is public and must not
# run outside contributors' code on anyone's own machine (scripts/test/workflow-policy.test.mjs fails
# the build if a workflow names another kind of runner). Pull requests from forks run the same jobs
# with a read-only token and no secrets; there is deliberately no pull_request_target. `ci-ok` is the
# one check the main ruleset requires.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Hosted runners are UTC already; saying so keeps date-sensitive tests the same everywhere.
  TZ: UTC

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD^1 (main, in the PR's merge commit) is what the migration journal check compares with.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm comes from the packageManager field via corepack: the org only allows GitHub-owned actions.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/ci/migration-journal.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm comes from the packageManager field via corepack: the org only allows GitHub-owned actions.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm comes from the packageManager field via corepack: the org only allows GitHub-owned actions.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # What `pnpm test` runs, minus the engine benchmark: it times the engine against wall-clock
      # ceilings and gets its own job so it never shares a two-core runner with other work.
      - run: pnpm -r --if-present test

  benchmark:
    name: Engine benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm comes from the packageManager field via corepack: the org only allows GitHub-owned actions.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:performance

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway server owned by this job. The suites refuse any non-loopback host and make and
      # drop their own databases on it.
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm comes from the packageManager field via corepack: the org only allows GitHub-owned actions.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # A hosted runner has two CPUs shared with Postgres; one package at a time on two workers keeps
      # per-test latency under the suites' timeouts. The service's default max_connections (100)
      # covers that.
      - run: pnpm -r --workspace-concurrency=1 --if-present test:integration --maxWorkers=2

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm comes from the packageManager field via corepack: the org only allows GitHub-owned actions.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # The production bundle in a real browser: unit tests, typecheck and `pnpm dev` all pass on code the
  # built output breaks. Builds the portal, starts it and clicks through it
  # (scripts/smoke/production-click.mjs) against its own throwaway database. Chrome for Testing has
  # no Linux Arm64 build, so this stays on x86-64; the self-host smoke covers Arm64.
  smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm comes from the packageManager field via corepack: the org only allows GitHub-owned actions.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:portal
      - name: Install Chrome for Testing
        run: |
          # The build puppeteer-core is pinned to, so a dependency bump moves the browser with it.
          # Accepted risk: this is an HTTPS-only download with no checksum pin,
          # of a binary that only runs the smoke against a throwaway
          # database in a job with a read-only token and no secrets. The pinned tools in the hygiene
          # job, which gate the secret scan itself, are sha256-checked.
          exe=$(node scripts/smoke/install-chrome.mjs "$RUNNER_TOOL_CACHE/chrome-for-testing")
          missing=$(ldd "$exe" | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "::error::Chrome needs shared libraries this runner lacks:"
            echo "$missing"
            exit 1
          fi
          "$exe" --version
          echo "SMOKE_BROWSER_PATH=$exe" >> "$GITHUB_ENV"
      - run: pnpm smoke:production
      # The archive-removals flows, each against its own scratch database on the same built portal.
      - run: pnpm smoke:closed
      - run: pnpm smoke:source-cancel
      - run: pnpm smoke:recurrence-end

  # The quick start end to end (scripts/selfhost/smoke.mjs): builds every image from source (nothing
  # is published yet), starts the `app,bundled-db` stack, drives it with the CLI, restarts it, backs it
  # up and checks nothing is published beyond loopback. Runs on x86-64 and Arm64 so Apple Silicon and
  # Raspberry Pi support stay proven. No secrets and no Docker context other than the runner's own.
  selfhost-smoke:
    name: Self-host smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86-64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/selfhost/smoke.mjs --timeout-minutes 25

  # Workflow lint and a full-history secret scan, inlined because the private repository's shared
  # actions are not reachable from here. Both tools are downloaded from their release page and checked
  # against a pinned sha256 before they run.
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          curl -sSfL -o "$dir/a.tgz" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $dir/a.tgz" | sha256sum -c -
          tar -xzf "$dir/a.tgz" -C "$dir" actionlint
          "$dir/actionlint" -color
      - name: gitleaks
        env:
          VERSION: 8.28.0
          # From the v8.28.0 release's published gitleaks_8.28.0_checksums.txt (linux_x64 tarball).
          SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          curl -sSfL -o "$dir/g.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $dir/g.tgz" | sha256sum -c -
          tar -xzf "$dir/g.tgz" -C "$dir" gitleaks
          # The config is written here, not committed: the export audit forbids a .gitleaks.toml and
          # inline allow comments in the tree. It allows exactly the two RFC 8291 section 5 test
          # vectors, and only in the two web-push test files (AND: both the path and the value must
          # match); every other finding fails the job.
          cat > "$dir/gitleaks.toml" <<'TOML'
          title = "OpenRhen CI"

          [extend]
          useDefault = true

          [[allowlists]]
          description = "RFC 8291 section 5 test vectors in the web-push tests"
          condition = "AND"
          paths = [
            '''integrations/outbound-proxy/src/web-push\.test\.ts''',
            '''integrations/outbound-proxy/src/server\.test\.ts''',
          ]
          regexes = [
            '''BTBZMqHH6r4Tts7J_aSIgg''',
            '''yfWPiYE-n46HLnH0KqZOF1fJJU3MYrct3AELtAQ-oRw''',
          ]
          TOML
          "$dir/gitleaks" detect --redact --no-banner --exit-code 1 --config "$dir/gitleaks.toml"

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The org only allows GitHub-owned actions, so the reuse tool is installed from PyPI at a pinned version.
      - run: pipx run reuse==6.2.0 lint

  # An example add-on, copied over a clean checkout, must work with core without editing a core file:
  # scripts/addon/conformance.mjs checks ownership, structure, the compose merge, env fragments and routes.
  # Node and the runner's Docker (compose config only; nothing is built or started) are all it needs.
  addon-conformance:
    name: Add-on conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/addon/conformance.mjs

  # The device agent in tools/rhen-watch (Rust). Its rules are pure and tested on any OS; the Windows layer is
  # compiled and linted on windows-latest, which is the only place that proves it builds. No Rust toolchain
  # action: the hosted images carry stable Rust, and the org only allows GitHub-owned actions.
  rhen-watch:
    name: rhen-watch (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: windows-latest
    defaults:
      run:
        working-directory: tools/rhen-watch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      # The testers' download: the two release binaries (TESTING.md step 1). Paths are from the repo root because
      # `uses` steps ignore the job's working-directory.
      - name: Upload Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rhen-watch-windows
          path: |
            tools/rhen-watch/target/release/rhen-watch.exe
            tools/rhen-watch/target/release/rhen-watchw.exe
          if-no-files-found: error
          retention-days: 30
      # The real Windows binaries on a real runner (a throwaway VM): install, record, upgrade over a running copy,
      # kill and automatic restart by the scheduled task, clean stop, export, uninstall and purge. Every native call is checked, because pwsh does not stop
      # on a non-zero exit by itself. Observation only. The runner may have no interactive desktop, so the only
      # event that is certain is the agent's own start; the app switches are checked by hand (TESTING.md).
      - name: Install and uninstall smoke
        if: runner.os == 'Windows'
        # A hung step fails here in minutes instead of holding the job to its limit.
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $built = (Resolve-Path .\target\release\rhen-watch.exe).Path
          $dest = Join-Path $env:LOCALAPPDATA 'Programs\rhen-watch'
          $data = Join-Path $env:LOCALAPPDATA 'rhen-watch'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'

          # Run a native command, fail on a non-zero exit, show and return its output.
          function Rw([string]$exe, [string[]]$cmdArgs) {
            $out = (& $exe @cmdArgs 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "rhen-watch $cmdArgs failed with exit code ${LASTEXITCODE}: $out" }
            Write-Host "> rhen-watch $cmdArgs"
            Write-Host $out
            return $out
          }
          function Wait-Agent([bool]$running, [int]$seconds) {
            $until = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $until) {
              $s = Rw "$dest\rhen-watch.exe" @('status')
              if (($s -match 'agent: running') -eq $running) { return }
              Start-Sleep -Milliseconds 500
            }
            throw "the agent did not become running=$running within $seconds s"
          }

          # 1. Install: two per-user Scheduled Tasks (start at logon; a keep-alive every minute that revives a dead
          # agent), so the Run entry is gone (one mechanism) and `status` says so.
          Rw $built @('install') | Out-Null
          if (-not (Test-Path "$dest\rhen-watchw.exe")) { throw 'program not installed' }
          if (Get-ItemProperty $runKey -Name 'rhen-watch' -ErrorAction SilentlyContinue) { throw 'the Run entry is set although the task is registered' }
          & schtasks /Query /TN rhen-watch 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'the rhen-watch scheduled task is not registered' }
          & schtasks /Query /TN rhen-watch-keepalive 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'the rhen-watch-keepalive scheduled task is not registered' }
          if ((Rw "$dest\rhen-watch.exe" @('status')) -notmatch 'restart on crash: yes') { throw 'status does not report restart on crash' }

          # 2. After about 5 s it has recorded something. Its own start is the one event that is certain.
          Start-Sleep -Seconds 5
          $status = Rw "$dest\rhen-watch.exe" @('status')
          if ($status -notmatch 'agent: running') { throw 'the installed agent is not running' }
          if ($status -notmatch 'database: [\d.]+ MB, (\d+) events' -or [int]$Matches[1] -lt 1) { throw 'the agent recorded no events' }
          if ($status -notmatch 'last heartbeat: (\d+) s ago' -or [int]$Matches[1] -gt 35) { throw 'no recent heartbeat' }
          $report = Rw "$dest\rhen-watch.exe" @('report')
          if ($report -notmatch 'Activity for \d{4}-\d{2}-\d{2}') { throw 'the report has no day heading' }
          if ($report -match 'Nothing was captured') { throw 'the report shows nothing recorded although the agent runs' }

          # 3. Install again while the agent runs: it must stop the old copy, replace the files and start a new one.
          $oldPid = (Get-Process rhen-watchw).Id
          Rw $built @('install') | Out-Null
          Wait-Agent $true 10
          $newPid = (Get-Process rhen-watchw).Id
          if ($newPid -eq $oldPid) { throw 'the running copy was not replaced' }
          if ((Get-FileHash "$dest\rhen-watchw.exe").Hash -ne (Get-FileHash (Join-Path (Split-Path $built) 'rhen-watchw.exe')).Hash) { throw 'rhen-watchw.exe was not replaced' }
          if (Get-ChildItem $dest -Filter '*.new') { throw 'a staged .new file was left behind' }
          Rw "$dest\rhen-watch.exe" @('report') | Out-Null

          # 4. Kill only our agent as Task Manager or a power cut would. The keep-alive task must bring it back on its own
          # (the keep-alive runs every minute) and the report must show the gap as unknown.
          function Get-Agent { Get-Process rhen-watchw -ErrorAction SilentlyContinue | Where-Object { $_.Path -and ([IO.Path]::GetFileName($_.Path) -eq 'rhen-watchw.exe') } }
          $victim = (Get-Agent | Select-Object -First 1).Id
          if (-not $victim) { throw 'could not find our agent process' }
          # Pause the keep-alive for 15 s so the kill leaves a gap long enough to be recorded (a gap under 10 s is
          # not), then turn it back on: it must revive the agent by itself.
          schtasks /Change /TN rhen-watch-keepalive /DISABLE | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'could not pause the keep-alive task' }
          Stop-Process -Id $victim -Force
          Wait-Agent $false 15
          Start-Sleep -Seconds 15
          schtasks /Change /TN rhen-watch-keepalive /ENABLE | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'could not turn the keep-alive task back on' }
          $until = (Get-Date).AddSeconds(150)
          $back = $null
          while ((Get-Date) -lt $until -and -not $back) {
            Start-Sleep -Seconds 2
            $back = Get-Agent | Where-Object { $_.Id -ne $victim } | Select-Object -First 1
          }
          if (-not $back) {
            # Say what Task Scheduler thinks happened, so the failure explains itself.
            Write-Host '--- schtasks /Query /V (the task after the kill) ---'
            schtasks /Query /TN rhen-watch-keepalive /V /FO LIST | Out-Host
            Write-Host '--- Task Scheduler operational log, last 15 events ---'
            try { Get-WinEvent -LogName ('Micro' + 'soft-Windows-TaskScheduler/Operational') -MaxEvents 15 -ErrorAction Stop | Format-List TimeCreated, Id, Message | Out-Host } catch { Write-Host "log unavailable: $_" }
            throw 'the keep-alive task did not restart the killed agent within 150 s'
          }
          Wait-Agent $true 20
          $report = Rw "$dest\rhen-watch.exe" @('report')
          if ($report -notmatch 'Gaps where nothing is known' -or $report -notmatch '\d\d:\d\d-\d\d:\d\d\s+agent not running') { throw 'the kill left no unknown gap' }

          # 4b. A clean stop exits 0, so the task must NOT restart it.
          Rw "$dest\rhen-watch.exe" @('stop') | Out-Null
          Wait-Agent $false 15
          Start-Sleep -Seconds 90
          if (Get-Agent) { throw 'the task restarted an agent that was stopped cleanly' }
          if ((Rw "$dest\rhen-watch.exe" @('status')) -match 'agent: running') { throw 'a cleanly stopped agent is running again' }

          # 5. Export a copy of the database; a second export to the same file must refuse.
          $copy = Join-Path $env:RUNNER_TEMP 'rhen-watch-export.db'
          Remove-Item $copy -ErrorAction SilentlyContinue
          Rw "$dest\rhen-watch.exe" @('export', $copy) | Out-Null
          if ((Get-Item $copy).Length -le 0) { throw 'the export is empty' }
          & "$dest\rhen-watch.exe" export $copy 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'export overwrote an existing file' }

          # 6. Uninstall with --purge: program, start-at-logon entry and the whole data folder go.
          Rw "$dest\rhen-watch.exe" @('uninstall', '--purge') | Out-Null
          if (Test-Path "$dest\rhen-watchw.exe") { throw 'program still installed' }
          if (Get-ItemProperty $runKey -Name 'rhen-watch' -ErrorAction SilentlyContinue) { throw 'start-at-logon entry still set' }
          & schtasks /Query /TN rhen-watch 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'the scheduled task is still registered after uninstall' }
          & schtasks /Query /TN rhen-watch-keepalive 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'the keep-alive task is still registered after uninstall' }
          if (Test-Path $data) { throw "the data folder is still there: $((Get-ChildItem $data).Name -join ', ')" }
          # The two /Query calls above failed on purpose; do not let their exit code become the step's.
          $global:LASTEXITCODE = 0
      # Whatever the smoke did, leave the runner without a task or an agent.
      - name: Remove the smoke task
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          schtasks /Delete /TN rhen-watch /F 2>&1 | Out-Null
          schtasks /Delete /TN rhen-watch-keepalive /F 2>&1 | Out-Null
          Get-Process rhen-watchw -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 0
      # The agent records locally and must stay that way. A crate-name list alone cannot see std::net or a
      # Win32 networking feature, so this also checks the source and the windows-sys features. It is a
      # tripwire for review, not a proof.
      - name: No network code
        shell: bash
        run: |
          fail=0
          if cargo tree --locked --prefix none | grep -Ei '^(reqwest|hyper|ureq|curl|isahc|surf|attohttpc|native-tls|rustls|openssl|tokio|socket2|mio|tonic) '; then
            echo "::error::rhen-watch must not depend on a network crate"
            fail=1
          fi
          if grep -rnE 'std::net|TcpStream|TcpListener|UdpSocket|ToSocketAddrs' src --include='*.rs' --exclude='tests*.rs'; then
            echo "::error::rhen-watch must not use std::net or sockets"
            fail=1
          fi
          if grep -rniE '(winhttp|wininet|winsock|ws2_32|wsock32|urlmon)' src --include='*.rs' --exclude='tests*.rs'; then
            echo "::error::rhen-watch must not link or call a Windows networking API"
            fail=1
          fi
          if grep -nE 'Win32_Networking|Win32_NetworkManagement' Cargo.toml; then
            echo "::error::rhen-watch must not enable a windows-sys networking feature"
            fail=1
          fi
          exit "$fail"

  ios:
    name: iOS app
    # The Swift app in mobile/ios, built unsigned on GitHub's hosted macOS runner (free for a public repository).
    # It runs on every pull request so `ci-ok` never waits on a skipped job; it is small.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Host policy checks, XcodeGen, an unsigned Xcode build and the package checks, in one script you can also run on a Mac.
      - run: mobile/ios/ci-build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenRhen-unsigned-ipa
          path: mobile/ios/OpenRhen-unsigned.ipa
          retention-days: 14

  ios-spike:
    name: iOS signing spike
    # Throwaway build for slice 0.5 of the native app. Its own job, so a spike failure is named. Remove it with mobile/ios-spike.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mobile/ios-spike/ci-build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenRhen-Spike-unsigned-ipa
          path: mobile/ios-spike/OpenRhen-Spike-unsigned.ipa
          retention-days: 14

  ci-ok:
    name: ci-ok
    needs: [ios, ios-spike, rhen-watch, check, typecheck, unit, benchmark, integration, build, smoke, selfhost-smoke, hygiene, reuse, addon-conformance]
    # Runs even when a job above failed or was cancelled, so the required check is red, never missing.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {job: info.get("result") for job, info in needs.items() if info.get("result") != "success"}
          for job, info in sorted(needs.items()):
              print(f"{job}: {info.get('result')}")
          if not needs or bad:
              print("ci-ok failed: " + (", ".join(f"{j}={r}" for j, r in sorted(bad.items())) or "no jobs"))
              sys.exit(1)
          PY
